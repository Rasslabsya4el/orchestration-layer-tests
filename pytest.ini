[pytest]
testpaths = tests
pythonpath = .
markers =
    slow: multi-minute tests (run with -m slow)
    pob: opens a PobSession or the headless PoB runtime
    live: checks this machine's real install or state; run with -m live; outside the merge suite
addopts =
# #343: a str parameter longer than 100 characters keeps its whole text in the id, as pytest before 9.2 spelled it; the
# newest pytest (the GitHub job installs it) would write <argname><index>, and every id the PC's plan sent for such a test
# would be "not collected". Pytest before 9.2 does not know the key (its warning is filtered below).
parametrize_long_str_id_strategy = legacy
filterwarnings =
    ignore:Unknown config option. parametrize_long_str_id_strategy:pytest.PytestConfigWarning
